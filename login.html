<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page de connexion — AIA</title>
<style>
  :root{ --primary:#2563eb; --danger:#dc2626; --border:#e2e8f0; --muted:#64748b; --bg:#f8fafc; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  form{
    width:100%; max-width:320px; padding:28px; background:#fff; border:1px solid var(--border);
    border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.06);
  }
  .login-logo{ display:block; height:56px; width:auto; margin:0 auto 18px; }
  h1{ font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--primary); margin:0 0 6px; text-align:center; }
  p{ font-size:13px; color:var(--muted); margin:0 0 18px; text-align:center; }
  input{
    width:100%; padding:12px; font-size:16px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:14px;
  }
  button{
    width:100%; padding:12px; font-size:14px; font-weight:600; color:#fff; background:var(--primary);
    border:none; border-radius:8px; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  #loginError{ color:var(--danger); font-size:13px; margin-top:12px; display:none; }
</style>
</head>
<body>
<form id="loginForm">
  <img class="login-logo" src="/assets/logo-aia.png" alt="AIA">
  <h1>Page de connexion sécurisée</h1>
  <p>Entrez le code d'accès pour continuer.</p>
  <input type="password" id="codeInput" placeholder="Code d'accès" autocomplete="current-password" autofocus>
  <button type="submit" id="submitBtn">Se connecter</button>
  <p id="loginError"></p>
</form>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('loginError');
    const code = document.getElementById('codeInput').value;
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion…';
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json.ok) {
        window.location.href = '/';
        return;
      }
      errEl.textContent = json.error || 'Code incorrect.';
      errEl.style.display = 'block';
    } catch (err) {
      errEl.textContent = 'Erreur réseau, réessayez.';
      errEl.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  });
</script>
</body>
</html>
