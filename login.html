<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page de connexion — AIA</title>
<style>
  :root{ --primary:#2563eb; --danger:#dc2626; --border:#e2e8f0; --muted:#64748b; --bg:#f8fafc; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  form{
    width:100%; max-width:320px; padding:28px; background:#fff; border:1px solid var(--border);
    border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.06);
  }
  .login-logo{ display:block; height:56px; width:auto; margin:0 auto 18px; }
  h1{ font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--primary); margin:0 0 6px; text-align:center; }
  p{ font-size:13px; color:var(--muted); margin:0 0 18px; text-align:center; }
  input, select{
    width:100%; padding:12px; font-size:16px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:14px; font-family:inherit; background:#fff; color:inherit;
  }
  button{
    width:100%; padding:12px; font-size:14px; font-weight:600; color:#fff; background:var(--primary);
    border:none; border-radius:8px; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  #loginError{ color:var(--danger); font-size:13px; margin-top:12px; display:none; }
  .register-link{ font-size:13px; text-align:center; margin-top:16px; }
  .register-link a{ color:var(--primary); text-decoration:none; }
  .register-link a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<form id="loginForm">
  <img class="login-logo" src="/assets/logo-aia.png" alt="AIA">
  <h1>Page de connexion sécurisée</h1>
  <p>Choisissez votre trigramme et entrez votre mot de passe.</p>
  <select id="usernameSelect" autofocus>
    <option value="">Chargement…</option>
  </select>
  <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password">
  <button type="submit" id="submitBtn">Se connecter</button>
  <p id="loginError"></p>
  <p class="register-link"><a href="/register.html">Créer un compte</a></p>
</form>
<script>
  // Menu déroulant des trigrammes existants (voir api/usernames.js — public, ne renvoie que les
  // trigrammes) plutôt qu'un champ texte libre. Si la liste ne peut pas être chargée ou est vide
  // (base neuve, aucun compte créé), on retombe sur un champ texte classique plutôt que de bloquer
  // la connexion.
  const usernameSelect = document.getElementById('usernameSelect');
  function fallBackToTextInput(){
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'usernameSelect'; // même id : le reste du script lit toujours #usernameSelect.value
    input.placeholder = 'Trigramme';
    input.autocomplete = 'username';
    input.maxLength = 3;
    input.style.textTransform = 'uppercase';
    usernameSelect.replaceWith(input);
  }
  (async () => {
    try {
      const res = await fetch('/api/usernames', { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const { usernames } = await res.json();
      if(!Array.isArray(usernames) || usernames.length === 0){
        fallBackToTextInput();
        return;
      }
      usernameSelect.innerHTML = usernames.map(u => `<option value="${u}">${u}</option>`).join('');
    } catch (e) {
      fallBackToTextInput();
    }
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('loginError');
    const username = document.getElementById('usernameSelect').value;
    const password = document.getElementById('passwordInput').value;
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json.ok) {
        // Le middleware redirige lui-même vers /pending.html si le compte n'a pas encore été
        // validé par un admin — pas besoin de distinguer les cas ici.
        window.location.href = '/';
        return;
      }
      errEl.textContent = json.error || 'Trigramme ou mot de passe incorrect.';
      errEl.style.display = 'block';
    } catch (err) {
      errEl.textContent = 'Erreur réseau, réessayez.';
      errEl.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  });
</script>
</body>
</html>
