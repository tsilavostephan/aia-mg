<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte en attente — AIA</title>
<style>
  :root{ --primary:#2563eb; --border:#e2e8f0; --muted:#64748b; --bg:#f8fafc; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  .box{
    width:100%; max-width:340px; padding:28px; background:#fff; border:1px solid var(--border);
    border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.06); text-align:center;
  }
  .box img{ display:block; height:56px; width:auto; margin:0 auto 18px; }
  h1{ font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--primary); margin:0 0 10px; }
  p{ font-size:13.5px; color:var(--muted); margin:0 0 18px; line-height:1.5; }
  a{
    display:inline-block; font-size:13px; font-weight:600; color:var(--primary); text-decoration:none;
  }
  a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="box">
  <img src="/assets/logo-aia.png" alt="AIA">
  <h1>Compte en attente de validation</h1>
  <p>Votre compte a bien été créé, mais il doit être validé par un administrateur avant de pouvoir accéder à l'application. Revenez un peu plus tard.</p>
  <a href="/api/logout">⏻ Se déconnecter</a>
</div>
</body>
</html>
