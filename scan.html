<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>AIA Scan</title>
<link rel="manifest" href="manifest-scan.json">
<meta name="theme-color" content="#113D91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIA Scan">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --card:#111827; --border:#1f2937; --text:#f3f4f6; --muted:#9ca3af;
    --primary:#2563eb; --danger:#f87171; --success:#4ade80;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  .scan-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; width:100%; max-width:480px; }
  .scan-header img{ height:34px; width:auto; }
  .scan-header-text{ flex:1; }
  .scan-title{ font-size:14px; font-weight:700; margin:0; }
  .scan-version{ font-size:11px; color:var(--muted); margin:0; }

  #scanReaderContainer{
    width:100%; max-width:480px; border-radius:14px; overflow:hidden;
    background:#000; border:1px solid var(--border);
  }
  #scanReaderContainer video{ width:100% !important; }

  #scanError{
    display:none; margin-top:14px; padding:10px 14px; border-radius:10px;
    background:rgba(248,113,113,0.12); color:var(--danger); font-size:13px; max-width:480px; text-align:center;
  }

  #scanMessage{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 10px);
    /* z-index au-dessus de #scanResultOverlay (z-index:50) : en mode rafale, un nouveau scan sans
       correspondance peut arriver alors que la fiche d'un colis précédent est encore affichée —
       ce message doit rester visible par-dessus, pas caché derrière. */
    z-index:60;
    max-width:calc(100vw - 32px); padding:10px 16px; border-radius:10px;
    background:rgba(17,24,39,0.96); border:1px solid var(--border); color:var(--text);
    font-size:13px; text-align:center; opacity:0; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  #scanMessage.visible{ opacity:1; transform:translate(-50%, 0); }

  #scanResultOverlay{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; padding:20px; padding-top:calc(20px + env(safe-area-inset-top));
    opacity:0; pointer-events:none; transition:opacity .15s ease;
    overflow-y:auto;
  }
  #scanResultOverlay.visible{ opacity:1; pointer-events:auto; }
  .scan-result-title{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--primary); margin:0 0 16px; }
  #scanResultBody{ flex:1; }
  .scan-result-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--border); font-size:14px;
  }
  .scan-result-row:last-child{ border-bottom:none; }
  .scan-result-label{ color:var(--muted); flex-shrink:0; }
  .scan-result-value{ text-align:right; word-break:break-word; }
  .scan-result-value.bold{ font-weight:700; }
  .scan-result-value.qty-match{ color:var(--success); font-weight:700; }
  .scan-result-value.qty-mismatch{ color:var(--danger); font-weight:700; }

  #scanResultQr{ display:flex; justify-content:center; padding:18px 0 6px; }
  #scanResultQr img, #scanResultQr canvas{ border-radius:8px; background:#fff; padding:10px; }

  #newScanBtn{
    margin-top:16px; padding:14px; font-size:14px; font-weight:600; color:#fff;
    background:var(--primary); border:none; border-radius:10px; cursor:pointer;
  }

  /* Champ invisible qui capte la frappe d'une douchette code-barres (USB/Bluetooth) : ce type
     d'appareil se comporte comme un clavier, il "tape" le code puis Entrée dans l'élément qui a le
     focus — sans champ de saisie à l'écran, ces frappes se perdraient. Reste focus en permanence
     (voir assets/scan.js) sans jamais s'afficher ni ouvrir le clavier virtuel du téléphone
     (inputmode="none" — la douchette elle-même n'est pas concernée, seul le clavier tactile l'est). */
  #scanHiddenInput{
    position:fixed; top:0; left:0; width:1px; height:1px; padding:0; border:none; margin:0;
    opacity:0; pointer-events:none;
  }

</style>
</head>
<body>

<div class="scan-header">
  <img src="assets/logo-aia.png" alt="AIA">
  <div class="scan-header-text">
    <p class="scan-title">AIA Scan</p>
    <p class="scan-version" id="scanVersion"></p>
  </div>
</div>

<div id="scanReaderContainer"></div>
<div id="scanError"></div>
<input type="text" id="scanHiddenInput" inputmode="none" autocomplete="off" tabindex="-1">

<div id="scanMessage"></div>

<div id="scanResultOverlay">
  <h2 class="scan-result-title">Détails du colis</h2>
  <div id="scanResultBody"></div>
  <div id="scanResultQr"></div>
  <button type="button" id="newScanBtn">🔄 Nouveau scan</button>
</div>

<script src="assets/scan.js"></script>
</body>
</html>
