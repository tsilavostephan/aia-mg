<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>AIA Scan</title>
<link rel="manifest" href="manifest-scan.json">
<meta name="theme-color" content="#113D91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIA Scan">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --card:#111827; --border:#1f2937; --text:#f3f4f6; --muted:#9ca3af;
    --primary:#2563eb; --danger:#f87171; --success:#4ade80;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px;
    /* viewport-fit=cover étend le contenu sous l'encoche/la barre système : sans cette marge, le
       header (bouton caméra + avatar) se retrouve collé à la barre de statut iOS, voire recouvert
       par elle (constaté en prod, aggravé par le bandeau d'enregistrement d'écran qui réduit encore
       l'espace utile en haut). */
    padding-top:calc(16px + env(safe-area-inset-top));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  .scan-header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; width:100%; max-width:480px; }
  .scan-header img{ height:34px; width:auto; }
  .scan-header-text{ flex:1; }
  .scan-title{ font-size:14px; font-weight:700; margin:0; }
  .scan-version{ font-size:11px; color:var(--muted); margin:0; }

  /* Bouton d'activation/désactivation caméra — un rôle "mobile" n'a accès à rien d'autre sur cette
     page ; pouvoir couper la caméra à la demande (batterie, discrétion en entrepôt partagé, ou
     simplement laisser la douchette code-barres travailler seule) sans quitter la page. */
  #toggleCameraBtn{
    flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 14px;
    font-size:12px; font-weight:600; color:#fff; background:var(--primary);
    border:none; border-radius:999px; cursor:pointer; white-space:nowrap;
    transition:background .15s ease;
  }
  #toggleCameraBtn.camera-off{ background:#374151; color:var(--muted); }
  #toggleCameraBtn:active{ transform:scale(0.97); }

  /* ---------- menu utilisateur (avatar trigramme + déroulant Déconnexion/Mot de passe) ---------- */
  .user-menu{ position:relative; flex-shrink:0; }
  .user-avatar-btn{
    width:34px; height:34px; padding:0; margin:0;
    border-radius:50%; border:1px solid var(--primary);
    background:var(--primary); color:#fff;
    font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .user-menu-dropdown{
    position:absolute; top:calc(100% + 8px); right:0;
    min-width:190px;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    padding:6px; z-index:80;
  }
  .user-menu-name{
    padding:8px 10px 6px; font-size:12px; color:var(--muted);
    border-bottom:1px solid var(--border); margin-bottom:4px;
  }
  .user-menu-name strong{ color:var(--text); font-weight:700; }
  .user-menu-item{
    display:flex; align-items:center; gap:8px;
    width:100%; padding:9px 10px;
    font-size:13px; font-weight:500; text-align:left; text-decoration:none;
    color:var(--text); background:none; border:none; border-radius:7px;
    cursor:pointer; margin:0;
  }
  .user-menu-item:hover{ background:rgba(37,99,235,0.15); }

  #changePasswordModalBg{
    position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.6);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #changePasswordModalBg .modal-box{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px; width:100%; max-width:360px;
  }
  #changePasswordModalBg h2{ font-size:15px; margin:0 0 14px; }
  #changePasswordModalBg label{ display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px; }
  #changePasswordModalBg input{
    width:100%; padding:9px 11px; font-size:14px; font-family:inherit;
    border:1px solid var(--border); border-radius:7px; background:#0f1729; color:var(--text);
  }
  #changePasswordError{ font-size:12.5px; color:var(--danger); margin-top:10px; min-height:1px; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-actions button{
    flex:1; padding:10px; font-size:13.5px; font-weight:600; border-radius:7px; cursor:pointer;
    border:1px solid var(--primary); background:var(--primary); color:#fff;
  }
  .modal-actions button.secondary{ background:none; border-color:var(--border); color:var(--text); }

  #scanReaderContainer, #scanReaderPlaceholder{
    width:100%; max-width:480px; border-radius:14px; overflow:hidden;
    background:#000; border:1px solid var(--border);
  }
  #scanReaderContainer video{ width:100% !important; }

  #scanReaderPlaceholder{
    display:none; min-height:260px; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--muted); text-align:center; padding:24px;
  }
  #scanReaderPlaceholder .placeholder-icon{ font-size:40px; opacity:.6; }
  #scanReaderPlaceholder p{ margin:0; font-size:13px; }

  #scanError{
    display:none; margin-top:14px; padding:10px 14px; border-radius:10px;
    background:rgba(248,113,113,0.12); color:var(--danger); font-size:13px; max-width:480px; text-align:center;
  }

  #scanMessage{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 10px);
    /* z-index au-dessus de #scanResultOverlay (z-index:50) : en mode rafale, un nouveau scan sans
       correspondance peut arriver alors que la fiche d'un colis précédent est encore affichée —
       ce message doit rester visible par-dessus, pas caché derrière. */
    z-index:60;
    max-width:calc(100vw - 32px); padding:10px 16px; border-radius:10px;
    background:rgba(17,24,39,0.96); border:1px solid var(--border); color:var(--text);
    font-size:13px; text-align:center; opacity:0; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  #scanMessage.visible{ opacity:1; transform:translate(-50%, 0); }

  #scanResultOverlay{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; padding:20px; padding-top:calc(20px + env(safe-area-inset-top));
    opacity:0; pointer-events:none; transition:opacity .15s ease;
    overflow-y:auto;
  }
  #scanResultOverlay.visible{ opacity:1; pointer-events:auto; }
  .scan-result-title{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--primary); margin:0 0 16px; }
  #scanResultBody{ flex:1; }
  .scan-result-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--border); font-size:14px;
  }
  .scan-result-row:last-child{ border-bottom:none; }
  .scan-result-label{ color:var(--muted); flex-shrink:0; }
  .scan-result-value{ text-align:right; word-break:break-word; }
  .scan-result-value.bold{ font-weight:700; }
  .scan-result-value.qty-match{ color:var(--success); font-weight:700; }
  .scan-result-value.qty-mismatch{ color:var(--danger); font-weight:700; }

  #scanResultQr{ display:flex; justify-content:center; padding:18px 0 6px; }
  #scanResultQr img, #scanResultQr canvas{ border-radius:8px; background:#fff; padding:10px; }

  #newScanBtn{
    margin-top:16px; padding:14px; font-size:14px; font-weight:600; color:#fff;
    background:var(--primary); border:none; border-radius:10px; cursor:pointer;
  }

  /* Popup plein écran quand le colis scanné n'est pas trouvé en base — plus visible qu'un simple
     message en bas d'écran, se ferme toute seule après un court délai (voir assets/scan.js) pour
     rester dans l'esprit "mains libres" du mode rafale. */
  #scanNotFoundOverlay{
    position:fixed; inset:0; z-index:70; background:rgba(127,29,29,0.97);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  #scanNotFoundOverlay.visible{ opacity:1; }
  .scan-not-found-icon{ font-size:64px; line-height:1; }
  .scan-not-found-title{ font-size:20px; font-weight:800; letter-spacing:.03em; color:#fff; text-align:center; }
  .scan-not-found-code{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; color:rgba(255,255,255,0.75); text-align:center; word-break:break-all; padding:0 24px; }

  /* Champ invisible qui capte la frappe d'une douchette code-barres (USB/Bluetooth) : ce type
     d'appareil se comporte comme un clavier, il "tape" le code puis Entrée dans l'élément qui a le
     focus — sans champ de saisie à l'écran, ces frappes se perdraient. Reste focus en permanence
     (voir assets/scan.js) sans jamais s'afficher ni ouvrir le clavier virtuel du téléphone
     (inputmode="none" — la douchette elle-même n'est pas concernée, seul le clavier tactile l'est). */
  #scanHiddenInput{
    position:fixed; top:0; left:0; width:1px; height:1px; padding:0; border:none; margin:0;
    opacity:0; pointer-events:none;
  }

</style>
</head>
<body>

<div class="scan-header">
  <img src="assets/logo-aia.png" alt="AIA">
  <div class="scan-header-text">
    <p class="scan-title">AIA Scan</p>
    <p class="scan-version" id="scanVersion"></p>
  </div>
  <button type="button" id="toggleCameraBtn" aria-pressed="true">📷 Désactiver</button>
  <div class="user-menu" id="userMenu">
    <button type="button" id="userMenuBtn" class="user-avatar-btn" title="Compte"></button>
    <div class="user-menu-dropdown" id="userMenuDropdown" style="display:none;">
      <div class="user-menu-name" id="userMenuName"></div>
      <button type="button" id="changePasswordBtn" class="user-menu-item">🔑 Modifier le mot de passe</button>
      <a href="/api/logout" class="user-menu-item">⏻ Déconnexion</a>
    </div>
  </div>
</div>

<div id="changePasswordModalBg">
  <div class="modal-box">
    <h2>Modifier le mot de passe</h2>
    <label>Mot de passe actuel</label>
    <input type="password" id="currentPasswordInput">
    <label>Nouveau mot de passe (4 caractères minimum)</label>
    <input type="password" id="newPasswordInput">
    <label>Confirmer le nouveau mot de passe</label>
    <input type="password" id="confirmPasswordInput">
    <div id="changePasswordError"></div>
    <div class="modal-actions">
      <button type="button" id="changePasswordSaveBtn">Enregistrer</button>
      <button type="button" id="changePasswordCancelBtn" class="secondary">Annuler</button>
    </div>
  </div>
</div>

<div id="scanReaderContainer"></div>
<div id="scanReaderPlaceholder">
  <div class="placeholder-icon">📷</div>
  <p>Caméra désactivée.<br>Appuyez sur « Activer » pour reprendre le scan.</p>
</div>
<div id="scanError"></div>
<input type="text" id="scanHiddenInput" inputmode="none" autocomplete="off" tabindex="-1">

<div id="scanMessage"></div>

<div id="scanNotFoundOverlay">
  <div class="scan-not-found-icon">❌</div>
  <div class="scan-not-found-title">COLIS NON TROUVÉ</div>
  <div class="scan-not-found-code" id="scanNotFoundCode"></div>
</div>

<div id="scanResultOverlay">
  <h2 class="scan-result-title">Détails du colis</h2>
  <div id="scanResultBody"></div>
  <div id="scanResultQr"></div>
  <button type="button" id="newScanBtn">🔄 Nouveau scan</button>
</div>

<script src="assets/scan.js"></script>
</body>
</html>
